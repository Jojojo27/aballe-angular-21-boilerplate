<h4 class="auth-heading">Login</h4>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
        <label class="form-label auth-label">Email</label>
        <input type="text" formControlName="email" class="form-control auth-input"
            [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <div *ngIf="f['email'].errors['required']">Email is required</div>
            <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
        </div>
    </div>
    <div class="mb-3">
        <label class="form-label auth-label">Password</label>
        <div class="password-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password"
                class="form-control auth-input"
                [ngClass]="{ 'is-invalid': submitted && f['password'].errors }" />
            <button type="button" class="password-toggle" (click)="showPassword = !showPassword">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="text-danger small mt-1">
            <div *ngIf="f['password'].errors['required']">Password is required</div>
        </div>
    </div>
    <div class="d-flex align-items-center justify-content-between mt-4">
        <button [disabled]="loading" class="btn auth-btn-primary">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Login
        </button>
        <a routerLink="../register" class="auth-link">Register</a>
    </div>
    <div class="text-center mt-3">
        <a routerLink="../forgot-password" class="auth-link-muted">Forgot Password?</a>
    </div>
    <div class="text-center mt-2">
        <a routerLink="../verify-email" class="auth-link-muted" style="font-size:0.85rem">Need to verify your email?</a>
    </div>
</form>
