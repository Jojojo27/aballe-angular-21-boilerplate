<h4 class="auth-heading">Forgot Password</h4>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <p class="auth-text-muted">Please enter your email address to receive a password reset link</p>
  <div class="mb-3">
    <label class="form-label auth-label">Email</label>
    <input type="text" formControlName="email" class="form-control auth-input" />
    <div *ngIf="submitted && f['email'].errors" class="text-danger small">
      <div *ngIf="f['email'].errors['required']">Email is required</div>
      <div *ngIf="f['email'].errors['email']">Email must be a valid email address</div>
    </div>
  </div>
  <button [disabled]="form.invalid || loading" class="btn auth-btn-primary">
    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
    Submit
  </button>
</form>

<div class="text-center mt-3">
  <a routerLink="/account/login" class="auth-link-muted">Back to Login</a>
</div>
