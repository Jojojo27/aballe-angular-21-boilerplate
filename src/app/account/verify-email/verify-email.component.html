<div class="col-md-6 offset-md-3 mt-5">
  <div class="card">
    <div class="card-body">
      <h4 class="card-title">Verify Email</h4>

      <div *ngIf="!token">
        <p>Thank you for registering! A verification link has been sent to your email address.</p>
        <p>Please check your inbox and click the link to verify your account before logging in.</p>
        <p><a routerLink="/account/login">Back to Login</a></p>
      </div>

      <div *ngIf="token">
        <div *ngIf="loading" class="text-center">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Verifying your email...
        </div>
      </div>
    </div>
  </div>
</div>
