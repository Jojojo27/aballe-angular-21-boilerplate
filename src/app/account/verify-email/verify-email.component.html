<!-- Auto-verifying state (came from email link) -->
<div *ngIf="autoVerifying && !verified" class="text-center py-4">
  <div class="spinner-border mb-3" style="color:rgba(255,255,255,0.8);width:3rem;height:3rem"></div>
  <h4 class="auth-heading" style="text-align:center">Verifying your email...</h4>
  <p class="auth-text-muted">Please wait a moment.</p>
</div>

<!-- Success state -->
<div *ngIf="verified" class="text-center py-3">
  <div class="mb-3" style="font-size:3rem;color:rgba(255,255,255,0.9)">&#10003;</div>
  <h4 class="auth-heading" style="text-align:center">Email Verified!</h4>
  <p class="auth-text-muted mb-4">Your email has been verified. You can now log in.</p>
  <a routerLink="/account/login" class="btn auth-btn-primary w-100">Go to Login</a>
</div>

<!-- Manual code entry form (only when NOT coming from email link) -->
<div *ngIf="!autoVerifying && !verified">
  <h4 class="auth-heading">Verify Your Email</h4>
  <p class="auth-text-muted mb-3">Enter the 6-digit code sent to your email address.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label class="form-label auth-label">Email Address</label>
      <input type="email" formControlName="email" class="form-control auth-input"
        [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
      <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
        <div *ngIf="f['email'].errors['required']">Email is required</div>
        <div *ngIf="f['email'].errors['email']">Enter a valid email</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label auth-label">Verification Code</label>
      <input type="text" formControlName="code" class="form-control auth-input text-center"
        maxlength="6" placeholder="000000" autocomplete="one-time-code"
        style="font-size:1.5rem;letter-spacing:.5rem"
        [ngClass]="{ 'is-invalid': submitted && f['code'].errors }" />
      <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">
        <div *ngIf="f['code'].errors['required']">Code is required</div>
        <div *ngIf="f['code'].errors['minlength'] || f['code'].errors['maxlength'] || f['code'].errors['pattern']">Must be a 6-digit number</div>
      </div>
    </div>

    <button [disabled]="loading" class="btn auth-btn-primary w-100">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
      Verify Email
    </button>

    <div class="mt-3 text-center">
      <a routerLink="/account/login" class="auth-link-muted">Back to Login</a>
    </div>

  </form>
</div>
