<div class="col-md-5 offset-md-3 mt-5">
  <div class="card">
    <div class="card-body">

      <!-- Success state -->
      <div *ngIf="verified" class="text-center py-3">
        <div class="mb-3" style="font-size:3rem">&#10003;</div>
        <h4 class="text-success">Email Verified!</h4>
        <p class="text-muted">Redirecting to login...</p>
      </div>

      <!-- Code entry form -->
      <div *ngIf="!verified">
        <h4 class="card-title mb-1">Verify Your Email</h4>
        <p class="text-muted small mb-3">Enter the 6-digit code sent to your email address.</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">

          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" formControlName="email" class="form-control"
              [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
            <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
              <div *ngIf="f['email'].errors['required']">Email is required</div>
              <div *ngIf="f['email'].errors['email']">Enter a valid email</div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Verification Code</label>
            <input type="text" formControlName="code" class="form-control text-center"
              maxlength="6" placeholder="000000" autocomplete="one-time-code"
              style="font-size:1.5rem;letter-spacing:.5rem"
              [ngClass]="{ 'is-invalid': submitted && f['code'].errors }" />
            <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">
              <div *ngIf="f['code'].errors['required']">Code is required</div>
              <div *ngIf="f['code'].errors['minlength'] || f['code'].errors['maxlength'] || f['code'].errors['pattern']">Must be a 6-digit number</div>
            </div>
          </div>

          <button [disabled]="loading" class="btn btn-primary w-100">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Verify Email
          </button>

          <div class="mt-3 text-center small">
            <a routerLink="/account/login">Back to Login</a>
          </div>

        </form>
      </div>

    </div>
  </div>
</div>
