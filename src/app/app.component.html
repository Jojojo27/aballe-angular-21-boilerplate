<div class="app-container" [ngClass]="{ 'main-page': account }">
    <!-- main nav -->
    <nav class="navbar navbar-expand main-nav px-4" *ngIf="account">
        <span class="navbar-brand main-nav-brand">&#9670; IPT 2026</span>
        <div class="navbar-nav ms-auto">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item nav-link main-nav-link">Home</a>
            <a routerLink="/profile" routerLinkActive="active" class="nav-item nav-link main-nav-link">Profile</a>
            <a *ngIf="account.role === Role.Admin" routerLink="/admin" routerLinkActive="active" class="nav-item nav-link main-nav-link">Admin</a>
            <button (click)="logout()" class="btn btn-link nav-item nav-link main-nav-link">Logout</button>
        </div>
    </nav>

    <!-- subnav router outlet -->
    <router-outlet name="subnav"></router-outlet>

    <!-- global alert -->
    <alert></alert>

    <!-- main router outlet -->
    <router-outlet></router-outlet>
</div>
